name: Native ownership

on:
  pull_request:

permissions:
  contents: read

jobs:
  ownership:
    name: Unsigned ownership regressions
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require immutable baseline defects
        run: python3 .github/tests/test_native_ownership.py --baseline
      - name: Verify fixed native sources
        run: python3 .github/tests/test_native_ownership.py
      - name: Preserve manual release lifecycle
        run: python3 -m unittest discover -s .github/tests -p 'test_lifecycle.py' -q
